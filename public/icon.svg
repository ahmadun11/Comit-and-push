<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- Phone Body -->
  <rect x="146" y="80" width="220" height="352" rx="36" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="12" />
  
  <!-- Speaker & Notch -->
  <rect x="216" y="104" width="80" height="8" rx="4" fill="#334155" />
  
  <!-- Screen Area -->
  <rect x="166" y="128" width="180" height="248" rx="16" fill="#020617" />
  
  <!-- Screen Graphics: Circuit / Tools -->
  <path d="M 200 180 L 256 236 L 312 180" fill="none" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="270" r="28" fill="none" stroke="url(#amberGrad)" stroke-width="10" />
  <path d="M 235 270 L 277 270 M 256 249 L 256 291" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  
  <!-- Home Indicator -->
  <rect x="216" y="402" width="80" height="8" rx="4" fill="#06b6d4" />
</svg>
