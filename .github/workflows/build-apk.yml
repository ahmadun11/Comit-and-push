name: Build Android APK

on:
  push:
    branches:
      - main # Atau master, sesuaikan dengan branch utama repository Anda

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Sesuaikan versi Node.js proyek Anda

      - name: Install Dependencies
        run: npm install # Ganti dengan 'bun install' jika menggunakan Bun dan tambahkan setup bun jika perlu

      - name: Build Web Assets
        run: npm run build # Perintah build Vite/React Anda

      - name: Add Android Platform (Capacitor)
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
